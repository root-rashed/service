<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::extraHead})}">
<head>
    <title>Create your account</title>
    <th:block th:fragment="extraHead">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
        <style>
            /* ServiZone register — ReUI-style card. Scoped with the .rl- prefix so it won't clash with auth.css. */
            .rl-page {
                --rl-fg: #0a0a0a;
                --rl-muted: #737373;
                --rl-border: #e5e5e5;
                --rl-danger: #dc2626;
                --rl-radius: 8px;
                display: flex;
                justify-content: center;
                padding: 56px 16px 72px;
                background-color: #fff;
                background-image:
                        linear-gradient(to right, rgba(0, 0, 0, .035) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 0, 0, .035) 1px, transparent 1px);
                background-size: 40px 40px;
                font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                color: var(--rl-fg);
            }

            .rl-card {
                width: 100%;
                max-width: 360px;
                background: transparent;
                border: 0;
                box-shadow: none;
                padding: 0;
                text-align: center;
            }

            .rl-logo {
                width: 32px;
                height: 32px;
                margin: 0 auto 18px;
                display: grid;
                place-items: center;
                border-radius: 9px;
                background: #171717;
                color: #fff;
            }

            .rl-title {
                margin: 0;
                font-size: 20px;
                font-weight: 600;
                line-height: 1.3;
                letter-spacing: -.01em;
                color: var(--rl-fg);
            }

            .rl-sub {
                margin: 6px 0 22px;
                font-size: 14px;
                color: var(--rl-muted);
            }

            /* Fields */
            .rl-field { text-align: left; margin-bottom: 14px; }

            .rl-label {
                display: block;
                margin-bottom: 7px;
                font-size: 14px;
                font-weight: 500;
                color: var(--rl-fg);
            }

            .rl-input-wrap { position: relative; }

            .rl-input {
                display: block;
                width: 100%;
                height: 32px;
                padding: 0 12px;
                font: inherit;
                font-size: 14px;
                color: var(--rl-fg);
                background: #fff;
                border: 1px solid var(--rl-border);
                border-radius: var(--rl-radius);
                outline: none;
                box-shadow: none;
                transition: border-color .15s, box-shadow .15s;
            }
            .rl-input::placeholder { color: #8a8a8a; }
            .rl-input:focus {
                border-color: #a3a3a3;
                box-shadow: 0 0 0 3px rgba(0, 0, 0, .06);
            }
            .rl-input-wrap .rl-input { padding-right: 38px; }

            .rl-eye {
                position: absolute;
                top: 0;
                right: 0;
                width: 36px;
                height: 100%;
                display: grid;
                place-items: center;
                border: 0;
                background: none;
                color: var(--rl-muted);
                cursor: pointer;
                font-size: 14px;
            }
            .rl-eye:hover { color: var(--rl-fg); }

            /* Segmented account-type choice */
            .rl-segmented {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .rl-segmented label { margin: 0; cursor: pointer; }
            .rl-segmented input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }
            .rl-segmented span {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 32px;
                font-size: 14px;
                font-weight: 500;
                color: var(--rl-fg);
                background: #fff;
                border: 1px solid var(--rl-border);
                border-radius: var(--rl-radius);
                transition: background-color .15s, border-color .15s, color .15s;
            }
            .rl-segmented label:hover span { background: #f5f5f5; }
            .rl-segmented input:checked + span {
                background: #171717;
                border-color: #171717;
                color: #fff;
            }
            .rl-segmented input:focus-visible + span { outline: 2px solid #171717; outline-offset: 2px; }

            /* Hints and errors */
            .rl-hint {
                margin: 6px 0 0;
                font-size: 12px;
                color: var(--rl-muted);
            }
            .rl-error {
                margin: 6px 0 0;
                font-size: 12px;
                color: var(--rl-danger);
                text-align: left;
            }
            .rl-field.has-error .rl-input { border-color: var(--rl-danger); }
            .rl-field.has-error .rl-input:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, .12); }

            /* Button */
            .rl-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 32px;
                margin-top: 6px;
                padding: 0 14px;
                font: inherit;
                font-size: 14px;
                font-weight: 500;
                line-height: 1;
                color: #fff;
                background: #171717;
                border: 1px solid #171717;
                border-radius: var(--rl-radius);
                cursor: pointer;
                transition: background-color .15s;
            }
            .rl-btn:hover { background: #2b2b2b; }
            .rl-btn:focus-visible { outline: 2px solid #171717; outline-offset: 2px; }

            .rl-foot {
                margin: 22px 0 0;
                font-size: 14px;
                color: var(--rl-muted);
            }
            .rl-link {
                margin-left: 2px;
                font-weight: 500;
                color: var(--rl-fg);
                text-decoration: none;
            }
            .rl-link:hover { text-decoration: underline; }

            @media (max-width: 420px) {
                .rl-page { padding-top: 36px; }
            }
        </style>
    </th:block>
</head>
<body>
<main class="rl-page">
    <section class="rl-card" aria-labelledby="register-title">

<!--        <div class="rl-logo" aria-hidden="true">-->
<!--            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"-->
<!--                 stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">-->
<!--                <path d="M7 5v8a5 5 0 0 0 10 0V5"/>-->
<!--            </svg>-->
<!--        </div>-->

        <h1 id="register-title" class="rl-title">Create your account</h1>
        <p class="rl-sub">Book trusted professionals or offer your services.</p>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" data-loading-on-submit>

            <div class="rl-field" th:classappend="${#fields.hasErrors('accountType')} ? 'has-error'">
                <div class="rl-segmented" role="radiogroup" aria-labelledby="account-type-label">
                    <label><input type="radio" th:field="*{accountType}" value="CUSTOMER"><span>Book services</span></label>
                    <label><input type="radio" th:field="*{accountType}" value="WORKER"><span>Offer services</span></label>
                </div>
                <p class="rl-error" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></p>
            </div>

            <div class="rl-field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <label class="rl-label" for="name">Full name</label>
                <input class="rl-input" type="text" id="name" th:field="*{name}" autocomplete="name" placeholder="Your full name">
                <p class="rl-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="rl-field" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                <label class="rl-label" for="email">Email</label>
                <input class="rl-input" type="email" id="email" th:field="*{email}" autocomplete="email" placeholder="you@example.com">
                <p class="rl-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="rl-field" th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
                <label class="rl-label" for="phone">Phone</label>
                <input class="rl-input" type="tel" id="phone" th:field="*{phone}" autocomplete="tel" placeholder="01XXXXXXXXX">
                <p class="rl-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
            </div>

            <div class="rl-field" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                <label class="rl-label" for="password">Password</label>
                <div class="rl-input-wrap">
                    <input class="rl-input" type="password" id="password" th:field="*{password}" autocomplete="new-password" placeholder="Create a password">
                    <button class="rl-eye" type="button" data-toggle-password="#password" aria-label="Show password">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="rl-hint" th:unless="${#fields.hasErrors('password')}">At least 8 characters, with a letter and a number.</p>
                <p class="rl-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div class="rl-field" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                <label class="rl-label" for="confirmPassword">Confirm password</label>
                <div class="rl-input-wrap">
                    <input class="rl-input" type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" placeholder="Re-enter your password">
                    <button class="rl-eye" type="button" data-toggle-password="#confirmPassword" aria-label="Show password">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="rl-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
            </div>

            <p class="rl-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

            <button class="rl-btn" type="submit">Create account</button>
        </form>

        <p class="rl-foot">Already registered? <a class="rl-link" th:href="@{/login}">Log in</a></p>

    </section>
</main>
</body>
</html>

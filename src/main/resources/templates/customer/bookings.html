<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::extraHead})}">
<head>
    <title>My bookings</title>
    <th:block th:fragment="extraHead">
        <meta name="robots" content="noindex">
        <link rel="stylesheet" th:href="@{/css/pages.css}">
        <link rel="stylesheet" th:href="@{/css/booking.css}">
        <style>
            /* ServiZone My bookings — ReUI-style look. Every rule is scoped under .cb (the <main> class). */
            .cb {
                --c-fg: #0a0a0a;
                --c-muted: #737373;
                --c-border: #e5e5e5;
                --c-hover: #f5f5f5;
                --c-primary: #171717;
                --c-danger: #dc2626;
                --c-radius: 8px;
                --c-radius-card: 12px;
                background-color: #fff;
                background-image:
                        linear-gradient(to right, rgba(0, 0, 0, .035) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 0, 0, .035) 1px, transparent 1px);
                background-size: 40px 40px;
                font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                color: var(--c-fg);
            }
            .cb .section { background: transparent; }
            .cb h1, .cb h2, .cb h3 {
                font-family: inherit;
                font-weight: 600;
                letter-spacing: -.01em;
                color: var(--c-fg);
            }
            .cb p, .cb .page-head p { color: var(--c-muted); }
            .cb .card {
                background: #fff;
                border: 1px solid var(--c-border);
                border-radius: var(--c-radius-card);
                box-shadow: none;
                transition: none;
            }
            .cb .card:hover { transform: none; box-shadow: none; border-color: var(--c-border); }

            /* Buttons: 36px high, 8px radius, no shadow */
            .cb .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 36px;
                min-height: 36px;
                padding: 0 16px;
                font-family: inherit;
                font-size: 14px;
                font-weight: 500;
                line-height: 1;
                border-radius: var(--c-radius);
                border: 1px solid transparent;
                box-shadow: none;
                text-decoration: none;
                transform: none;
                transition: background-color .15s, border-color .15s;
            }
            .cb .btn:hover { transform: none; box-shadow: none; text-decoration: none; }
            .cb .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
            .cb .btn--primary { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
            .cb .btn--primary:hover { background: #2b2b2b; border-color: #2b2b2b; color: #fff; }
            .cb .btn--outline { background: #fff; border-color: var(--c-border); color: var(--c-fg); }
            .cb .btn--outline:hover { background: var(--c-hover); border-color: var(--c-border); color: var(--c-fg); }
            .cb .btn--ghost { background: transparent; border-color: transparent; color: var(--c-fg); }
            .cb .btn--ghost:hover { background: var(--c-hover); color: var(--c-fg); }

            /* Job cards */
            .cb .job-card__head h2 { font-size: 16px; }
            .cb .job-card__head h2 a { color: var(--c-fg); text-decoration: none; }
            .cb .job-card__head h2 a:hover { text-decoration: underline; }
            .cb .detail-grid dt { color: var(--c-muted); font-weight: 500; }
            .cb .detail-grid dd { color: var(--c-fg); }

            /* Status badges: neutral grey; red only for error-type statuses */
            .cb .badge {
                background: var(--c-hover);
                color: var(--c-fg);
                border: 1px solid var(--c-border);
                box-shadow: none;
            }
            .cb .badge--red,
            .cb .badge--danger,
            .cb .badge--error {
                color: var(--c-danger);
                background: #fff;
                border-color: var(--c-danger);
            }

            /* Empty state: 1px bordered card, grey icon tile */
            .cb .empty-state {
                background: #fff;
                border: 1px solid var(--c-border);
                border-radius: var(--c-radius-card);
                box-shadow: none;
            }
            .cb .empty-state > i {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                font-size: 22px;
                color: #404040;
                background: var(--c-hover);
                border: 1px solid var(--c-border);
                border-radius: var(--c-radius);
            }
        </style>
    </th:block>
</head>
<body>
<main class="cb">
    <section class="section">
        <div class="container container--narrow">
            <div class="page-head page-head--row">
                <div>
                    <h1>My bookings</h1>
                    <p>Track requests, confirmed jobs and past bookings.</p>
                </div>
                <a class="btn btn--primary" th:href="@{/services}">Book a service</a>
            </div>

            <div class="job-list" th:if="${!bookings.isEmpty()}">
                <article class="card job-card" th:each="b : ${bookings.content}">
                    <div class="job-card__head">
                        <div>
                            <h2><a th:href="@{/booking/{id}(id=${b.id})}" th:text="${b.serviceTitle}">Service</a></h2>
                            <p>with <span th:text="${b.workerName}">Worker</span></p>
                        </div>
                        <span class="badge" th:classappend="'badge--' + ${b.statusTone}" th:text="${b.statusLabel}">Status</span>
                    </div>
                    <dl class="detail-grid">
                        <div><dt>Date</dt><dd th:text="${b.dateLabel}">date</dd></div>
                        <div><dt>Time</dt><dd th:text="${b.timeLabel}">time</dd></div>
                        <div><dt>Total (cash)</dt><dd>&#2547;<span th:text="${#numbers.formatDecimal(b.totalAmount, 1, 'COMMA', 2, 'POINT')}">840.00</span></dd></div>
                        <div><dt>Payment</dt><dd th:text="${b.paymentLabel}">Cash due</dd></div>
                    </dl>
                    <div class="job-card__actions">
                        <a class="btn btn--outline btn--sm" th:href="@{/booking/{id}(id=${b.id})}">View details</a>
                    </div>
                </article>
            </div>

            <div th:replace="~{fragments/pagination :: pagination(${bookings}, '/customer/bookings')}"></div>

            <div class="empty-state" th:if="${bookings.isEmpty()}">
                <i class="bi bi-calendar-check" aria-hidden="true"></i>
                <h3>No bookings yet</h3>
                <p>When you book a professional, your requests and jobs will show up here.</p>
                <a class="btn btn--primary" th:href="@{/services}">Browse services</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>

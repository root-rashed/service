<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::extraHead})}">
<head>
    <title th:text="'Find professionals | ' + ${@environment.getProperty('app.name', 'ServiZone')}">Find professionals</title>
    <th:block th:fragment="extraHead">
        <meta name="description" content="Browse verified local professionals: plumbers, cleaners, tutors, technicians and more. Compare ratings and experience before you book.">
        <link rel="canonical" th:href="${canonicalUrl}">
        <link rel="stylesheet" th:href="@{/css/marketplace.css}">
        <link rel="stylesheet" th:href="@{/css/pages.css}">
        <style>
            /* ServiZone Find professionals — ReUI-style look. Every rule is scoped under .wl (the <main> class). */
            .wl {
                --c-fg: #0a0a0a;
                --c-muted: #737373;
                --c-border: #e5e5e5;
                --c-hover: #f5f5f5;
                --c-primary: #171717;
                --c-radius: 8px;
                --c-radius-card: 12px;
                background-color: #fff;
                background-image:
                        linear-gradient(to right, rgba(0, 0, 0, .035) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 0, 0, .035) 1px, transparent 1px);
                background-size: 40px 40px;
                font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                color: var(--c-fg);
            }
            .wl .section { background: transparent; }
            .wl h1, .wl h2, .wl h3 {
                font-family: inherit;
                font-weight: 600;
                letter-spacing: -.01em;
                color: var(--c-fg);
            }
            .wl p, .wl .page-head p { color: var(--c-muted); }
            .wl strong { color: var(--c-fg); font-weight: 600; }

            /* Buttons: 36px high, 8px radius, no shadow */
            .wl .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 36px;
                min-height: 36px;
                padding: 0 16px;
                font-family: inherit;
                font-size: 14px;
                font-weight: 500;
                line-height: 1;
                border-radius: var(--c-radius);
                border: 1px solid transparent;
                box-shadow: none;
                text-decoration: none;
                transform: none;
                transition: background-color .15s, border-color .15s;
            }
            .wl .btn:hover { transform: none; box-shadow: none; text-decoration: none; }
            .wl .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
            .wl .btn--primary { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
            .wl .btn--primary:hover { background: #2b2b2b; border-color: #2b2b2b; color: #fff; }
            .wl .btn--outline { background: #fff; border-color: var(--c-border); color: var(--c-fg); }
            .wl .btn--outline:hover { background: var(--c-hover); border-color: var(--c-border); color: var(--c-fg); }

            /* Empty state: 1px bordered card, grey icon tile */
            .wl .empty-state {
                background: #fff;
                border: 1px solid var(--c-border);
                border-radius: var(--c-radius-card);
                box-shadow: none;
            }
            .wl .empty-state > i {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                font-size: 22px;
                color: #404040;
                background: var(--c-hover);
                border: 1px solid var(--c-border);
                border-radius: var(--c-radius);
            }
        </style>
    </th:block>
</head>
<body>
<main class="wl">
    <section class="section">
        <div class="container">
            <div class="page-head">
                <h1>Find Professionals</h1>
                <p>Verified professionals, ranked by rating and completed jobs.</p>
            </div>

            <div class="worker-grid" th:if="${!workers.isEmpty()}">
                <th:block th:each="worker : ${workers.content}">
                    <article th:replace="~{fragments/cards :: workerCard(${worker})}"></article>
                </th:block>
            </div>

            <div th:replace="~{fragments/pagination :: pagination(${workers}, '/workers')}"></div>

            <div class="empty-state" th:if="${workers.isEmpty()}">
                <i class="bi bi-people" aria-hidden="true"></i>
                <h3>No professionals yet</h3>
                <p>Verified professionals will appear here as soon as their profiles are approved.</p>
                <a class="btn btn--primary" th:href="@{/register(type='WORKER')}">Become a professional</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
    pagination(page, path)              -> links carry only ?page=N
    paginationQuery(page, path, query)  -> links keep the current filters; query is an already
                                           URL-encoded string such as "q=plumber&sort=PRICE_LOW" (may be empty)
    "page" is a Spring Data Page.
*/-->
<nav class="pagination" th:fragment="pagination(page, path)" th:if="${page.totalPages > 1}" aria-label="Pagination">
    <style>
        /* ReUI-style look. Scoped under .pagination. */
        .pagination { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .pagination .pagination__link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            min-height: 36px;
            padding: 0 14px;
            font-size: 14px;
            font-weight: 500;
            color: #0a0a0a;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            box-shadow: none;
            text-decoration: none;
            transition: background-color .15s;
        }
        .pagination a.pagination__link:hover { background: #f5f5f5; text-decoration: none; }
        .pagination a.pagination__link:focus-visible { outline: 2px solid #171717; outline-offset: 2px; }
        .pagination .pagination__link.is-disabled {
            color: #737373;
            background: #fff;
            opacity: .6;
            cursor: not-allowed;
        }
        .pagination .pagination__status { font-size: 14px; color: #737373; }
    </style>
    <a class="pagination__link" th:if="${page.hasPrevious()}" th:href="@{${path}(page=${page.number - 1})}" rel="prev">Previous</a>
    <span class="pagination__link is-disabled" th:unless="${page.hasPrevious()}" aria-disabled="true">Previous</span>
    <span class="pagination__status">Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span></span>
    <a class="pagination__link" th:if="${page.hasNext()}" th:href="@{${path}(page=${page.number + 1})}" rel="next">Next</a>
    <span class="pagination__link is-disabled" th:unless="${page.hasNext()}" aria-disabled="true">Next</span>
</nav>

<nav class="pagination" th:fragment="paginationQuery(page, path, query)" th:if="${page.totalPages > 1}" aria-label="Pagination">
    <style>
        /* ReUI-style look. Scoped under .pagination. */
        .pagination { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .pagination .pagination__link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            min-height: 36px;
            padding: 0 14px;
            font-size: 14px;
            font-weight: 500;
            color: #0a0a0a;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            box-shadow: none;
            text-decoration: none;
            transition: background-color .15s;
        }
        .pagination a.pagination__link:hover { background: #f5f5f5; text-decoration: none; }
        .pagination a.pagination__link:focus-visible { outline: 2px solid #171717; outline-offset: 2px; }
        .pagination .pagination__link.is-disabled {
            color: #737373;
            background: #fff;
            opacity: .6;
            cursor: not-allowed;
        }
        .pagination .pagination__status { font-size: 14px; color: #737373; }
    </style>
    <a class="pagination__link" th:if="${page.hasPrevious()}"
       th:href="@{${path + '?' + query + (query.isEmpty() ? '' : '&') + 'page=' + (page.number - 1)}}" rel="prev">Previous</a>
    <span class="pagination__link is-disabled" th:unless="${page.hasPrevious()}" aria-disabled="true">Previous</span>
    <span class="pagination__status">Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span></span>
    <a class="pagination__link" th:if="${page.hasNext()}"
       th:href="@{${path + '?' + query + (query.isEmpty() ? '' : '&') + 'page=' + (page.number + 1)}}" rel="next">Next</a>
    <span class="pagination__link is-disabled" th:unless="${page.hasNext()}" aria-disabled="true">Next</span>
</nav>
</body>
</html>

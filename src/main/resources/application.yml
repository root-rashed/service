spring:
  application:
    name: market

  # Local convenience: if a .env file exists next to the project (gitignored),
  # load it so RESEND_API_KEY / MAIL_FROM / CONTACT_EMAIL work with `mvn
  # spring-boot:run` and the IDE, without exporting them by hand. Optional, so
  # it is simply skipped when the file is absent (e.g. in a container).
  config:
    import: "optional:file:.env[.properties]"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mongodb:
    uri: ${MONGODB_URI:mongodb+srv://mongo:mangomango@apitesting.fdd2m4g.mongodb.net/serviceDB?appName=apiTesting}

  data:
    mongodb:
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  name: ${APP_NAME:ServiZone}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # One business time zone for working hours, "today" and booking dates.
  timezone: ${APP_TIMEZONE:Asia/Dhaka}
  # Outgoing email is delivered through Resend's HTTPS API (no SMTP). The key comes from the
  # environment; never put a real key in this file. See the README for setup.
  mail:
    provider: resend
    api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:onboarding@resend.dev}
  contact:
    # Where contact-form submissions are delivered. Leave blank to disable the relay
    # (the page still confirms receipt, nothing is stored).
    to: ${CONTACT_EMAIL:rashedulislam16032019@gmail.com}
  storage:
    path: ${UPLOAD_DIR:${STORAGE_PATH:./storage}}
  security:
    max-login-attempts: 5
    lock-minutes: 15
  otp:
    secret: ${OTP_SECRET:dev-only-otp-secret-change-me}
    expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-per-hour: 5
  booking:
    # Platform fee charged on top of the service price (cash only, no online payment).
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:5}
    # Customers may cancel free of charge until this many hours before the start time.
    cancel-cutoff-hours: 2
    # Minimum notice for a same-day booking.
    min-notice-minutes: 120
    # How far ahead bookings may be made.
    max-advance-days: 60
    # Granularity of the offered time slots.
    slot-step-minutes: 30
  chatbot:
    # The assistant uses a local Ollama model when one is running. Switch it off to answer
    # entirely from the built-in rules, which need no model and work on any deployment.
    enabled: ${CHATBOT_ENABLED:true}
    # Hard limit on how long to wait for the model before answering from the rules instead.
    timeout-seconds: ${CHATBOT_TIMEOUT_SECONDS:12}
    # Turns kept in the HTTP session; older turns are dropped so the page cannot grow forever.
    history-size: 12
    # Services listed in one answer.
    max-results: 4
    # Failed model attempts in a row before the model is left alone for the cooling-off period.
    failure-threshold: ${CHATBOT_FAILURE_THRESHOLD:1}
    cooldown-seconds: ${CHATBOT_COOLDOWN_SECONDS:120}
  admin:
    # Optional bootstrap administrator, created on first start only when no ADMIN exists.
    # Both values must be supplied in production; leave blank to skip bootstrapping.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}

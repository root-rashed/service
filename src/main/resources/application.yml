spring:
  application:
    name: market

  config:
    import: "optional:file:.env[.properties]"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mongodb:
    uri: ${MONGODB_URI:}

  data:
    mongodb:
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          options:
            temperature: 0.2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  name: ${APP_NAME:ServiZone}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # One business time zone for working hours, "today" and booking dates.
  timezone: ${APP_TIMEZONE:Asia/Dhaka}
  # Outgoing email is delivered through Resend's HTTPS API (no SMTP). The key comes from the
  # environment; never put a real key in this file. See the README for setup.
  mail:
    provider: brevo
    api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
  contact:
    # Where contact-form submissions are delivered. Leave blank to disable the relay
    # (the page still confirms receipt, nothing is stored).
    to: ${CONTACT_EMAIL:}
  storage:
    path: ${UPLOAD_DIR:${STORAGE_PATH:./storage}}
  security:
    max-login-attempts: 5
    lock-minutes: 15
  otp:
    secret: ${OTP_SECRET:}
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
    max-per-hour: 5
  booking:
    # Platform fee charged on top of the service price (cash only, no online payment).
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:5}
    # Customers may cancel free of charge until this many hours before the start time.
    cancel-cutoff-hours: 2
    # Minimum notice for a same-day booking.
    min-notice-minutes: 120
    # How far ahead bookings may be made.
    max-advance-days: 60
    # Granularity of the offered time slots.
    slot-step-minutes: 30

  chatbot:
    enabled: ${CHATBOT_ENABLED:true}
    timeout-seconds: ${CHATBOT_TIMEOUT_SECONDS:12}
    history-size: 12
    failure-threshold: ${CHATBOT_FAILURE_THRESHOLD:1}
    cooldown-seconds: ${CHATBOT_COOLDOWN_SECONDS:120}
